services:
  - type: web
    name: guarantorlens-backend
    env: python
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: GUNICORN_CMD_ARGS
        value: "-k uvicorn.workers.UvicornWorker"
    # Do NOT store secrets here; set them in the Render dashboard instead.
    # Example env var entries (prefer setting these in Render UI):
    # envVars:
    #   - key: DATABASE_URL
    #     value: ""
    #   - key: SECRET_KEY
    #     generator: secret
